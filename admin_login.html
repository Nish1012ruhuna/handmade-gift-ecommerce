<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFTORA | Admin Login</title>
    <link rel="stylesheet" href="/giftora/admin_login.css">
</head>
<body class="login-page">

    <main class="login-card">
        <div class="brand-icon">🎁</div>

        <h1>GIFTORA</h1>
        <p class="subtitle">Store Administration</p>

        <h2>Welcome Back!</h2>
        <p class="muted">Sign in to manage your store.</p>

        <form id="adminLoginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter admin email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <p id="loginMessage" class="message" role="alert"></p>

            <button type="submit" id="loginButton">Sign In</button>
        </form>

        <a href="/giftora/home.html" class="back-link">
            ← Back to GIFTORA
        </a>
    </main>

    <script src="/giftora/admin_login.js"></script>
</body>
</html>
