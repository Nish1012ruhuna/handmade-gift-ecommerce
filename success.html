<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Payment Successful | GIFTORA
    </title>


    <link rel="preconnect"
          href="https://fonts.googleapis.com">


    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #f7f5f0;

            font-family: Poppins, sans-serif;

            color: #333;

        }


        .success-container {

            width: 90%;

            max-width: 550px;

            padding: 50px 35px;

            background: white;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.08);

        }


        .icon {

            font-size: 65px;

            margin-bottom: 20px;

        }


        h1 {

            font-family:
                "Playfair Display",
                serif;

            font-size: 38px;

            margin-bottom: 15px;

        }


        p {

            line-height: 1.7;

            color: #666;

        }


        .btn {

            display: inline-block;

            margin-top: 25px;

            padding: 13px 30px;

            background: #333;

            color: white;

            text-decoration: none;

            border-radius: 6px;

        }


        .btn:hover {

            opacity: 0.9;

        }

    </style>

</head>


<body>


    <div class="success-container">


        <div class="icon">
            🎉
        </div>


        <h1>
            Payment Successful!
        </h1>


        <p>
            Thank you for shopping with GIFTORA.
        </p>


        <p>
            Your payment has been successfully
            processed through PayHere Sandbox.
        </p>


        <a href="home.html"
           class="btn">

            Continue Shopping

        </a>


    </div>


</body>

</html>
